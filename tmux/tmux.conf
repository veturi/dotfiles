# Set base index for windows to 1 instead of 0 for faster access
set -g base-index 1

# Limit history
set -g history-limit 5000

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# Use § as a prefix (same as herdr)
unbind C-b
set -g prefix §
bind-key '§' send-prefix

# Use prefix-r to reload config
bind r source-file ~/.tmux.conf

set -g mouse on
set -sg escape-time 0
set -g focus-events on

# Set vi-style copy bindings, Enter copies to macOS clipboard
set-window-option -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# pane numbering timeout
set -g display-panes-time 2000

# Plugins via TPM (install.sh clones it, then prefix-I installs plugins)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'

# Restore nvim/vim session if Session.vim is present
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Show continuum status
set -g status-right 'Cntnm: #{continuum_status}'

# Start tmux, run resurrect on machine boot
# set -g @continuum-boot 'on'
# set -g @continuum-boot-options 'iterm,fullscreen'

run '~/.tmux/plugins/tpm/tpm'
